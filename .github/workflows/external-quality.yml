name: SOTW Public Semantic Checks

# Deliberately manual-only until root qualifies a genuine public observer
# project or verifies private free minutes and a zero-overage budget.
# Proposed prospective cadence after approval: '17 */2 * * *' (UTC).
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sotw-external-quality-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SOTW_EXTERNAL_POLICY_START: ${{ vars.SOTW_EXTERNAL_POLICY_START }}
      SOTW_EXTERNAL_EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Checkout only the checker files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified official tag 2026-10-12
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/observe_external_quality.mjs
            scripts/check-external-quality-observer.mjs
            .github/workflows/external-quality.yml
      - name: Use Node without dependency installs or cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7, verified official tag 2026-10-12
        with:
          node-version: '22'
          package-manager-cache: false
          check-latest: false
      - name: Validate observer fixtures without network access
        run: node scripts/check-external-quality-observer.mjs
      - name: Observe four bounded public semantic checks
        run: node scripts/observe_external_quality.mjs --run --output external-quality-artifacts
      - name: Retain original outcomes, including failures
        if: always()
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, verified official tag 2026-10-12
        with:
          name: sotw-external-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: external-quality-artifacts/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
          include-hidden-files: false
      - name: Record GitHub evidence coordinates
        if: always() && steps.evidence.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          printf 'Artifact ID: %s\nArtifact SHA256: %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
